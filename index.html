<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

    --muted: #6b7fa3; --white: #ffffff; --red: #e8344a;
  }
  body { font-family: system-ui, sans-serif; background: var(--light); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  .header { background: var(--navy); padding: 14px 20px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .logo { color: white; font-size: 18px; font-weight: 700; letter-spacing: -0.5px; }
  .divider { width: 1px; height: 20px; background: rgba(255,255,255,0.2); }
  .subtitle { color: var(--green); font-size: 11px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; }
  .chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .welcome { background: white; border: 1px solid var(--border); border-radius: 12px; padding: 18px; border-left: 4px solid var(--green); }
  .welcome h3 { font-size: 14px; color: var(--text); margin-bottom: 6px; }
  .welcome p { font-size: 13px; color: var(--muted); line-height: 1.5; margin-bottom: 14px; }
  .suggestions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .sug { background: var(--light); border: 1px solid var(--border); border-radius: 8px; padding: 10px; font-size: 12px; color: var(--blue); cursor: pointer; text-align: left; transition: all 0.15s; font-weight: 500; }
  .sug:hover { background: var(--blue); color: white; }
  .msg { display: flex; gap: 10px; align-items: flex-start; }
  .msg.user { flex-direction: row-reverse; }
  .av { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; }
  .av.ai { background: var(--green); color: var(--navy); }
  .av.user { background: var(--blue); color: white; }
  .bub { max-width: 80%; padding: 12px 16px; border-radius: 12px; font-size: 13.5px; line-height: 1.6; }
  .bub.ai { background: white; border: 1px solid var(--border); color: var(--text); border-radius: 2px 12px 12px 12px; white-space: pre-wrap; }
  .bub.user { background: var(--blue); color: white; border-radius: 12px 2px 12px 12px; }
  .typing { display: flex; gap: 4px; padding: 12px 16px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: b 1.2s infinite; }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes b { 0%,60%,100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-5px); opacity: 1; } }
  .input-area { padding: 14px 20px; background: white; border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: flex-end; flex-shrink: 0; }
  .input-wrap { flex: 1; background: var(--light); border: 1.5px solid var(--border); border-radius: 10px; display: flex; padding: 10px 14px; transition: border-color 0.15s; }
  .input-wrap:focus-within { border-color: var(--blue); }
  textarea { flex: 1; border: none; background: transparent; font-family: inherit; font-size: 13.5px; color: var(--text); resize: none; outline: none; line-height: 1.5; max-height: 100px; }
  textarea::placeholder { color: var(--muted); }
  .send { width: 40px; height: 40px; background: var(--blue); border: none; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.15s; }
  .send:hover { background: var(--navy); }
  .send:disabled { background: var(--border); cursor: not-allowed; }
  .send svg { width: 16px; height: 16px; fill: white; }
</style>

  } catch(e) {
    removeTyping();
    addMsg("ai", "Netværksfejl: " + e.message);
  }
  busy = false;
  document.getElementById("btn").disabled = false;
}
</script>
